name: test-submission-preflight

on:
  push:
    paths:
      - "portfolio/01-submission-preflight/**"
  pull_request:
    paths:
      - "portfolio/01-submission-preflight/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/01-submission-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: pytest
