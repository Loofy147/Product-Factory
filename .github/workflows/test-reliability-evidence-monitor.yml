name: reliability-evidence-monitor

on:
  push:
    paths:
      - "products/derivatives/reliability-evidence-monitor/**"
      - ".github/workflows/test-reliability-evidence-monitor.yml"
  pull_request:
    paths:
      - "products/derivatives/reliability-evidence-monitor/**"
      - ".github/workflows/test-reliability-evidence-monitor.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: pytest products/derivatives/reliability-evidence-monitor/test_monitor.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}/products/derivatives/reliability-evidence-monitor
