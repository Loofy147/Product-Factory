name: test-open-source-overlays

on:
  push:
    paths:
      - "products/derivatives/**"
  pull_request:
    paths:
      - "products/derivatives/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - products/derivatives/web-signal-intelligence
          - products/derivatives/private-knowledge-stream
          - products/derivatives/operations-grid
    defaults:
      run:
        working-directory: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: pytest