name: portfolio-python-tests

on:
  push:
    paths:
      - "portfolio/01-submission-preflight/**"
      - "portfolio/02-invoice-mismatch-scanner/**"
      - "portfolio/03-data-repair-receipt/**"
  pull_request:
    paths:
      - "portfolio/01-submission-preflight/**"
      - "portfolio/02-invoice-mismatch-scanner/**"
      - "portfolio/03-data-repair-receipt/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - portfolio/01-submission-preflight
          - portfolio/02-invoice-mismatch-scanner
          - portfolio/03-data-repair-receipt
    defaults:
      run:
        working-directory: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest
      - run: pytest
