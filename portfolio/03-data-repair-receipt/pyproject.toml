[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-repair-receipt"
version = "0.1.0"
description = "Small deterministic data repairs with before/after proof"
requires-python = ">=3.11"

[project.scripts]
data-repair-receipt = "data_repair_receipt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
